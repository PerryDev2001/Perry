<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <title>Admin sign in — Perry Philip Lozano</title>

  <!-- Apply the saved theme before anything paints -->
  <script>
    try {
      const t = localStorage.getItem("calling-card-theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    } catch { /* ignore */ }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="login-page">
  <div class="auth">
    <!-- Left: the form -->
    <div class="auth-main">
      <header class="auth-top">
        <a class="btn btn-ghost btn-sm auth-back-btn" href="index.html">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          Back
        </a>
        <button class="btn btn-ghost btn-icon" type="button" id="themeBtn" aria-label="Toggle theme">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
      </header>

      <main class="auth-center">
        <section class="auth-form" aria-label="Admin sign in">
          <form class="login-form" id="loginForm" novalidate>
            <label class="field">
              <span>Email</span>
              <input id="loginEmail" type="email" autocomplete="username" required placeholder="you@example.com" />
            </label>

            <div class="field">
              <div class="field-row">
                <label for="loginPassword">Password</label>
                <button class="link-btn link-muted" type="button" id="forgotPassword">Forgot password?</button>
              </div>
              <span class="password-wrap">
                <input id="loginPassword" type="password" autocomplete="current-password" required />
                <button class="password-toggle" type="button" id="passwordToggle" aria-label="Show password" aria-pressed="false">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>
                </button>
              </span>
            </div>

            <p class="alert" id="loginMessage" role="alert" hidden></p>

            <button class="btn btn-primary btn-block btn-lg" type="submit" id="loginSubmit">
              <span class="btn-spinner" aria-hidden="true"></span>
              <span class="btn-label">Sign in</span>
            </button>
          </form>

        </section>
      </main>
    </div>

    <!-- Right: photo + verse (desktop) -->
    <aside class="auth-aside" aria-hidden="true">
      <img src="img/ppl.jpg" alt="" />
      <div class="auth-aside-shade"></div>
      <figure class="auth-quote">
        <blockquote>“Commit your work to the LORD, and your plans will be established.”</blockquote>
        <figcaption>Proverbs 16:3</figcaption>
      </figure>
    </aside>
  </div>

  <script src="firebase-config.js"></script>
  <script src="login.js" defer></script>
</body>
</html>
