<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Perry Philip Lozano — Software Developer." />
  <meta name="color-scheme" content="light dark" />
  <title>Perry Philip Lozano — Software Developer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top-right toolbar: visitors + theme -->
  <div class="top-actions viewers reveal">
    <button class="tool-btn viewers-btn" type="button" id="viewersToggle" aria-label="See who viewed this page" aria-expanded="false" aria-controls="viewersPanel">
      <span class="viewers-eye" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </span>
      <span class="viewers-count is-loading" id="viewersCount">–</span>
      <span class="viewers-label" id="viewersLabel">visitors</span>
    </button>

    <span class="tool-divider" aria-hidden="true"></span>

    <button class="tool-btn theme-toggle" type="button" id="themeToggle" aria-label="Switch to dark theme">
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
      </svg>
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    </button>
  </div>

  <!-- Visitors list: who viewed the page -->
  <div class="viewers">
    <section class="viewers-panel" id="viewersPanel" role="dialog" aria-labelledby="viewersTitle" hidden>
      <header class="viewers-head">
        <h2 class="viewers-title" id="viewersTitle">Visitors</h2>
        <p class="viewers-sub" id="viewersTotal">Loading…</p>
      </header>
      <ol class="viewers-list" id="viewersList">
        <li class="viewers-empty">Loading…</li>
      </ol>
    </section>
  </div>

  <main class="hero" aria-labelledby="name">
    <div class="hero-text">
      <p class="eyebrow reveal" style="--i: 0">
        <span class="role">
          <svg class="role-heart" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21Z" />
          </svg>
          Software Developer
        </span>
      </p>

      <h1 id="name" class="name">
        <span class="name-line reveal" style="--i: 1">Perry Philip</span>
        <span class="name-line name-accent reveal" style="--i: 2">Lozano</span>
      </h1>

      <figure class="verse reveal" style="--i: 4">
        <blockquote>
          <p>“Commit your work to the LORD, and your plans will be established.”</p>
        </blockquote>
        <figcaption>
          <span class="ref">Proverbs 16:3</span>
        </figcaption>
      </figure>
    </div>

    <div class="portrait reveal" style="--i: 3" id="portrait">
      <div class="portrait-frame">
        <img class="avatar" src="img/ppl.jpg" alt="Perry Philip Lozano taking a mirror selfie" width="938" height="960" />
      </div>
    </div>
  </main>

  <footer class="site-footer reveal" style="--i: 6">
    <span>© 2026 Perry Philip Lozano</span>
  </footer>

  <!-- Public chat -->
  <div class="chat">
    <button class="chat-fab reveal" style="--i: 5" type="button" id="chatToggle" aria-label="Open chat" aria-expanded="false" aria-controls="chatPanel">
      <svg class="chat-fab-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.3 9.3 0 0 1-3.6-.7L3 21l1.6-4.6A8 8 0 0 1 3 11.5 8.6 8.6 0 0 1 12 3a8.6 8.6 0 0 1 9 8.5Z" />
        <path class="chat-fab-heart" d="M12 15.2s-3.2-1.9-3.2-4a1.7 1.7 0 0 1 3.2-.8 1.7 1.7 0 0 1 3.2.8c0 2.1-3.2 4-3.2 4Z" />
      </svg>
      <span class="chat-fab-label" aria-hidden="true">Chat</span>
      <span class="chat-badge" id="chatBadge" hidden>0</span>
    </button>

    <section class="chat-panel" id="chatPanel" role="dialog" aria-labelledby="chatTitle" hidden>
      <header class="chat-head">
        <div>
          <h2 class="chat-title" id="chatTitle"><span class="chat-live" aria-hidden="true"></span>Chat</h2>
          <p class="chat-sub">Say hi. Everyone can see messages here.</p>
        </div>
        <button class="icon-btn chat-close" type="button" id="chatClose" aria-label="Close chat">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </header>

      <ol class="chat-list" id="chatList" aria-live="polite">
        <li class="chat-empty">Loading messages…</li>
      </ol>

      <p class="chat-status" id="chatStatus" role="status" hidden></p>

      <form class="chat-form" id="chatForm" autocomplete="off">
        <label class="chat-name-row">
          <span class="chat-name-label">Name</span>
          <input class="chat-name" id="chatName" type="text" maxlength="24" placeholder="Anonymous" autocomplete="nickname" />
        </label>

        <div class="emoji-picker" id="emojiPicker" role="dialog" aria-label="Choose an emoji" hidden>
          <div class="emoji-tabs" id="emojiTabs" role="tablist"></div>
          <div class="emoji-grid" id="emojiGrid"></div>
        </div>

        <div class="chat-compose">
          <button class="chat-emoji-btn" id="emojiToggle" type="button" aria-label="Add emoji" aria-expanded="false" aria-controls="emojiPicker">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01" />
            </svg>
          </button>
          <textarea class="chat-text" id="chatText" rows="1" maxlength="500" placeholder="Write a message…" aria-label="Message" required></textarea>
          <span class="chat-count" id="chatCount" aria-live="polite" hidden></span>
          <button class="chat-send" id="chatSend" type="submit" aria-label="Send message" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
          </button>
        </div>
      </form>
    </section>
  </div>

  <div class="ambient-layer" id="ambientLayer" aria-hidden="true"></div>

  <div class="cursor-layer" id="cursorLayer" aria-hidden="true">
    <div class="cursor-dot" id="cursorDot"></div>
  </div>

  <script src="script.js"></script>
  <script src="chat.js" defer></script>
</body>
</html>
