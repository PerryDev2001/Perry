<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Perry Philip Lozano — Software Developer." />
  <meta name="color-scheme" content="light dark" />
  <title>Perry Philip Lozano — Software Developer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button class="icon-btn theme-toggle reveal" type="button" id="themeToggle" aria-label="Switch to dark theme">
    <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
    </svg>
    <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
  </button>

  <main class="hero" aria-labelledby="name">
    <div class="hero-text">
      <p class="eyebrow reveal" style="--i: 0">
        <span class="role">
          <svg class="role-heart" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21Z" />
          </svg>
          Software Developer
        </span>
      </p>

      <h1 id="name" class="name">
        <span class="name-line reveal" style="--i: 1">Perry Philip</span>
        <span class="name-line name-accent reveal" style="--i: 2">Lozano</span>
      </h1>

      <figure class="verse reveal" style="--i: 4">
        <blockquote>
          <p>“Commit your work to the LORD, and your plans will be established.”</p>
        </blockquote>
        <figcaption>
          <span class="ref">Proverbs 16:3</span>
        </figcaption>
      </figure>
    </div>

    <div class="portrait reveal" style="--i: 3" id="portrait">
      <div class="portrait-frame">
        <img class="avatar" src="img/ppl.jpg" alt="Perry Philip Lozano taking a mirror selfie" width="938" height="960" />
      </div>
    </div>
  </main>

  <footer class="site-footer reveal" style="--i: 6">
    <span>© 2026 Perry Philip Lozano</span>
  </footer>

  <div class="ambient-layer" id="ambientLayer" aria-hidden="true"></div>

  <div class="cursor-layer" id="cursorLayer" aria-hidden="true">
    <div class="cursor-dot" id="cursorDot"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
